<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vídeos com HTML5</title>
</head>
<body>
    <h1>Inserindo vídeos hospedando localmente</h1>
    <p> Este vídeo está hospedado no meu próprio servidor</p>
    <video src="midia/My-Video.webm" width="500" poster="imagens/poster.png" controls>
        <source src="midia/My-Video.webm" type="video/webm">
        <source src="midia/my-video.mp4" type="video/mp4">
        <source src="midia/my-video.ogv" type="video/ogg">
        <p>Seu navegador não tem compatibilidade com reprodução de vídeos.</p>

        <h1>Inserindo vídeos do YouTube</h1>
        <iframe width="560" height="315" src="https://www.youtube.com/embed/kuG3uTCb5a4?si=xTo92rz57CrIm6Q6" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
    </video>
</body>/
</html>
