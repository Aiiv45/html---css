<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste com imagens</title>
</head>
<body>
    <h1>Testando carga e Imagens</h1> 
    <hr>
    <br>
    <p>Abaixo voce verá uma imagem que está na mesma pasta</p>
    <img src="logo html-200.png" alt="Logo HTML 5"> 
    <!-- src= source(fonte ou origem) e alt= alternative(alternativa, o texto que explica melhor essa imagem)-->
     <p>Podemos tambem carregar imagens em sub-pastas.</p>
     <img src="imagens/logo css-200.png" alt="Logo CSS">
     <p>Tambem podemos carregar imagens externas</p> <!-- Copiar endereço da imagem no site-->
     <img src="https://e7.pngegg.com/pngimages/220/595/png-clipart-javascript-logo-product-design-brand-angularjs-dashboard-templates-angle-text-thumbnail.png" alt="Logo JavaScript"> <!-- URL-->
     <br>
     <img src="https://w7.pngwing.com/pngs/929/60/png-transparent-net-framework-c-net-core-software-framework-mono-studio-purple-studio-violet-thumbnail.png" alt="Logo C#">
</body>
</html>
