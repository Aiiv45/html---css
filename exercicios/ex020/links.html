<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links</title>
    <style>
        /* SELETORES PERSONALIZADOS
        # = id
        . = class
        : = pseudo-class
        :: = pseudo-element
        > = children
        */

        body{
            font-family: Arial, Helvetica, sans-serif;
        }

        a{
            color: red;
            text-decoration: none;
            font-weight: bold;
        }

        a:visited{
            color: rgb(242, 10, 250);
        }

        a:hover{
            color: black;
            text-decoration: none;
        }

        a:active{
            color: yellow;
        }

    </style>
</head>
<body>
    <h1>Links personalizados</h1>
    <ul>
        <li><a href="https://discord.com/channels/@me" target="_blank"> Discord</a>
        <li>
        <li>
    </ul>
</body>
</html>
