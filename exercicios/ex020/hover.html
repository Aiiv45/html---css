<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ex de hover</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }

        div > p{
            display: none;
        }

        div:hover > p{
            display: block;
            color: blue;
        }

        div:hover{
            color: red;
        }
    </style>
    
</head>
<body>
    <h1>Ex de hover</h1>
    <p>Passe o cursor aqui em baixo</p>
    <div>
        passe o cursor aqui
        <p>TEXTO ESCONDIDO...</p>
    </div>
    <div><a href="index.html">pagina anterior</a></div>
</body>
</html>
